// Reign of Nether — NeoForge 1.21.1
//
// Ported from the Forge 1.20.1 build (ForgeGradle 5.1, Gradle 7.6.5, Java 17, Parchment
// mappings) to ModDevGradle 2.0.146 / Gradle 8.14.4 / Java 21.
//
// What changed and why:
//   * ForgeGradle + Forge maven      -> net.neoforged.moddev (ModDevGradle). The merged
//                                        Minecraft+NeoForge artifact it produces is the
//                                        single source of vanilla bytecode for this project.
//   * Parchment mappings             -> official Mojang mappings. NeoForge 1.21.1 ships on
//                                        official names, so a refmap is neither generated
//                                        nor needed; mixin targets are validated statically
//                                        by gradle/validate-mixins.gradle instead.
//   * mixingradle + Mixin AP         -> removed for the same reason.
//   * accessTransformer in build      -> NeoForge applies META-INF/accesstransformer.cfg from
//                                        the jar at runtime, nothing to wire up in Gradle.
//   * reobfJar / jar.finalizedBy     -> no remapping stage in ModDevGradle.
//   * Essential Partner Mod (shadow)  -> dropped for now: no Java code references gg.essential,
//                                        and the 1.20.1-forge artifact has no verified
//                                        1.21.1-neoforge counterpart. Partner-server
//                                        compatibility is a known feature loss; see
//                                        _code_instructions/ or PORT_ANALYSIS.md.

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

apply from: 'gradle/validate-mixins.gradle'

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = neo_version

    runs {
      client {
        client()
        // Injects -mixin.config so a dev run applies the mod's own mixins explicitly,
        // which makes mixin failures readable instead of silent.
        programArgument '-mixin.config=reignofnether.mixins.json'
      }
        server {
            server()
        }
        data {
            // clientData() set a run type this ModDevGradle no longer knows; data() is the
            // supported spelling and is what runData wires up.
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // The mod widens a handful of vanilla members (Phantom's attack state, RenderStateShard's
    // flags, Mob's armour list, and so on - see META-INF/accesstransformer.cfg, converted to
    // 1.21.1 by tools/convert-access-transformer.sh). ModDevGradle applies this to the
    // compile classpath and to every dev run, so the code compiles against the same visibility
    // it gets at runtime.
    accessTransformers.from(layout.projectDirectory.file('src/main/resources/META-INF/accesstransformer.cfg'))
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ModDevGradle puts the Minecraft + NeoForge artifact on compileClasspath only; the tests
// need it too, otherwise nothing that touches a vanilla type will even link.
configurations.testCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.testRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'  : mod_id,
                'Specification-Vendor' : 'examplemodsareus',
                'Specification-Version' : '1',
                'Implementation-Title' : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'examplemodsareus',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The port breaks thousands of call sites at once during the bulk rename phases; the
    // default 100 error cap would hide the tail of the list every run.
    options.compilerArgs += ["-Xmaxerrs", "500000"]
}
// META-INF/neoforge.mods.toml is a template, and nothing expanded it: FML parses loaderVersion and
// every dependency versionRange into VersionRange objects the moment it reads the mod file, so a
// shipped jar carried the literal placeholders below and a real install refused it (the required
// neoforge dependency resolved to the single version string "${neo_version_range}"). The Forge
// build expanded these in processResources; the port renamed the file to neoforge.mods.toml and
// dropped the step, which stayed invisible because only dev runs were ever loaded - dev tolerates
// the placeholders, a production install does not.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
